[package]
name = "hypervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.3.0", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
actix-web = "4.14.0"
aws-sdk-s3 = "1"
aws-credential-types = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures = "0.3"
filetime = "0.2"
bytes = "1"
crun-sys = { git = "https://github.com/lu2000luk/crun-sys.git" }
oci-spec = "0.10.0"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["socket", "uio", "fs", "process"] }
libc = "0.2"
tar = "0.4"
flate2 = "1"
